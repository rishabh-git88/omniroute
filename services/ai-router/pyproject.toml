[project]
name = "omniroute-ai-router"
version = "0.1.0"
description = "Provider-neutral AI orchestration boundary for OmniRoute"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "httpx>=0.28,<0.29",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "hatchling>=1.27.0,<2.0.0",
  "jsonschema>=4.25,<5",
  "mypy>=1.18.0,<2.0.0",
  "pytest==9.1.1",
  "ruff==0.16.6",
  "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
