name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.20.0
  PNPM_VERSION: 12.3.4
  PYTHON_VERSION: '3.14'
  NEXT_PUBLIC_API_URL: https://api.ci.invalid
  RENDER_API_ORIGIN: https://api.ci.invalid

jobs:
  lint:
    name: Lint and environment validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --project services/ai-router --all-groups --frozen
      - name: Lint
        run: pnpm lint
      - name: Validate environment schemas
        run: pnpm --filter @omniroute/config test -- src/api.test.ts
      - name: Validate Compose configuration
        run: docker compose --profile application config --quiet

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/ai-router --all-groups --frozen
      - run: pnpm typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test --filter=@omniroute/web

  browser-e2e:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: pnpm install --frozen-lockfile
      - name: Build production workspace dependencies and web application
        run: pnpm build
      - name: Run deterministic browser acceptance
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm --filter @omniroute/web test:browser

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test --filter=@omniroute/api
      - name: Validate Prisma schema
        run: pnpm --filter @omniroute/api db:validate

  python-tests:
    name: AI Router tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --project services/ai-router --all-groups --frozen
      - run: uv run --project services/ai-router pytest

  integration-tests:
    name: Migration and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: pgvector/pgvector:pg18-bookworm
        env:
          POSTGRES_DB: omniroute_integration
          POSTGRES_PASSWORD: integration-admin-only
          POSTGRES_USER: integration_admin
        options: >-
          --health-cmd "pg_isready -U integration_admin -d omniroute_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      NODE_ENV: test
      DATABASE_TEST_URL: postgresql://omniroute_integration:integration-only@127.0.0.1:5432/omniroute_integration
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --project services/ai-router --all-groups --frozen
      - name: Bootstrap isolated non-superuser databases
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U integration_admin -d omniroute_integration -v ON_ERROR_STOP=1 < infrastructure/postgres/integration-init.sql
      - name: Build API workspace dependencies
        run: pnpm --filter '@omniroute/api^...' build
      - name: Rehearse core-to-memory upgrade with retained fixture data
        env:
          DATABASE_TEST_URL: postgresql://omniroute_integration:integration-only@127.0.0.1:5432/omniroute_integration_upgrade
        run: pnpm --filter @omniroute/api db:verify-upgrade
      - name: Validate migrations, drift, and database integration tests
        run: pnpm --filter @omniroute/api test:database

  build:
    name: Build and container validation
    needs:
      [
        lint,
        typecheck,
        frontend-tests,
        browser-e2e,
        backend-tests,
        python-tests,
        integration-tests,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/ai-router --all-groups --frozen
      - name: Validate Compose configurations
        run: |
          docker compose --profile application config --quiet
          docker compose -f compose.integration.yaml config --quiet
      - name: Build frontend, API, and router
        run: pnpm build
      - name: Build and smoke-test production images
        run: bash scripts/verify-images.sh
