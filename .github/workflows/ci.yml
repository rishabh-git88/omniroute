name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.20.0
  PNPM_VERSION: 12.3.4
  PYTHON_VERSION: '3.14'

jobs:
  lint:
    name: Lint and environment validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --project services/ai-router --all-groups --frozen
      - name: Lint
        run: pnpm lint
      - name: Validate environment schemas
        run: pnpm --filter @omniroute/config test -- src/api.test.ts
      - name: Validate Compose configuration
        run: docker compose --profile application config --quiet

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/ai-router --all-groups --frozen
      - run: pnpm typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omniroute/web test

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omniroute/api test

  python-tests:
    name: AI Router tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --project services/ai-router --all-groups --frozen
      - run: uv run --project services/ai-router pytest

  integration-tests:
    name: Migration and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: pgvector/pgvector:pg18-bookworm
        env:
          POSTGRES_DB: omniroute_test
          POSTGRES_PASSWORD: omniroute
          POSTGRES_USER: omniroute
        options: >-
          --health-cmd "pg_isready -U omniroute -d omniroute_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_TEST_URL: postgresql://omniroute:omniroute@localhost:5432/omniroute_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and verify migrations
        run: |
          pnpm --filter @omniroute/api exec prisma migrate deploy --config prisma-test.config.ts
          pnpm --filter @omniroute/api exec prisma migrate status --config prisma-test.config.ts
      - name: Run database integration tests
        run: pnpm --filter @omniroute/api test:database

  build:
    name: Build and container validation
    needs:
      [
        lint,
        typecheck,
        frontend-tests,
        backend-tests,
        python-tests,
        integration-tests,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/ai-router --all-groups --frozen
      - name: Build all deployables
        run: pnpm build
      - name: Build production images
        run: |
          docker build --file infrastructure/docker/api.Dockerfile --tag omniroute-api:ci .
          docker build --file infrastructure/docker/web.Dockerfile --tag omniroute-web:ci \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid .
          docker build --file infrastructure/docker/ai-router.Dockerfile --tag omniroute-ai-router:ci .
