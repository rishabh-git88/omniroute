# Render Blueprint for the production backend. Supabase remains the only
# production PostgreSQL provider and is intentionally not declared here.
services:
  - type: web
    name: omniroute-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: infrastructure/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: '4000'
      - key: LOG_LEVEL
        value: info
      - key: OTEL_SDK_DISABLED
        value: 'true'
      - key: OTEL_SERVICE_NAME
        value: omniroute-api
      - key: DAILY_FREE_CREDITS
        value: '1000'
      - key: PLATFORM_CREDITS_PER_USD
        value: '1000000'
      - key: AUTH_SESSION_TTL_HOURS
        value: '24'
      - key: AUTH_SESSION_ROTATION_MINUTES
        value: '15'
      # The OpenAI adapter is enabled here, but execution still fails closed
      # until a reviewed General-rollout registry entry is activated.
      - key: AI_EXECUTION_PROVIDER
        value: openai
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WEB_APP_URL
        value: https://oneroute-ai.vercel.app
      - key: CORS_ORIGIN
        value: https://oneroute-ai.vercel.app
      - key: API_PUBLIC_URL
        value: https://oneroute-ai.vercel.app
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: AI_ROUTER_INTERNAL_TOKEN
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: AI_ROUTER_URL
        fromService:
          name: omniroute-ai-router
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: omniroute-ai-router
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: infrastructure/docker/ai-router.Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: '8001'
      - key: AI_ROUTER_HOST
        value: 0.0.0.0
      - key: AI_ROUTER_PORT
        value: '8001'
      - key: AI_ROUTER_LOG_LEVEL
        value: info
      - key: AI_ROUTER_ENABLE_OPENAI
        value: 'true'
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_ROUTER_ENABLE_ANTHROPIC
        value: 'false'
      - key: AI_ROUTER_ENABLE_GEMINI
        value: 'false'
      - key: AI_ROUTER_INTERNAL_TOKEN
        fromService:
          name: omniroute-api
          type: web
          envVarKey: AI_ROUTER_INTERNAL_TOKEN
